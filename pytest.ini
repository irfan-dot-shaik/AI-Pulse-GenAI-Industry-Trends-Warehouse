# =============================================================================
# pytest.ini — AI Pulse Project
# =============================================================================
#
# PURPOSE:
#   Configures pytest's behavior for this project.
#   This file is read automatically by pytest when you run any pytest command.
#
# CONCEPT — Why Configure pytest?
#   Without configuration, pytest:
#     - Searches EVERYWHERE for test files (slow)
#     - Shows minimal output by default
#     - Doesn't know project conventions
#
#   With pytest.ini, we tell pytest exactly where to look and how to behave.
#
# =============================================================================

[pytest]

# Where to find tests (relative to this file)
# pytest will only look in the 'tests/' directory, not the whole project
testpaths = tests

# Default command-line options applied to every pytest run
# -v: verbose (show each test name and result)
# -s: show print() output from tests (useful for debugging)
# --tb=short: show short tracebacks instead of full ones
addopts = -v --tb=short

# Minimum pytest version required
# This ensures everyone uses a compatible version
minversion = 7.0

# Python file naming convention — only files matching this pattern are tests
python_files = test_*.py

# Python class naming convention — only classes matching this are test classes
python_classes = Test*

# Python function naming convention — only functions matching this are tests
python_functions = test_*
